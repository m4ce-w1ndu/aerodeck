[package]
name = "aerodeck"
version = "0.1.0"
edition = "2021"
description = "AeroDeck: High-performance flight simulator hardware engine & controller bridge (SPAD.neXt profile compatible)"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
evdev = "0.13"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
hidapi = { version = "2.6", optional = true }
regex = "1.10"
colored = "2.1"
futures = "0.3"
eframe = { version = "0.30", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.30"
rfd = "0.15"


[features]
default = ["hardware"]
hardware = ["dep:hidapi"]
