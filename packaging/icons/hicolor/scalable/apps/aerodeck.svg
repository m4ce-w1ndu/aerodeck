<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- AeroDeck App Icon: Flight Controller & Telemetry Engine -->
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="#0D1117" />
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#1E293B" stroke-width="12" />

  <!-- Unibody Flight Control Yoke Frame -->
  <path d="M 96 160 L 96 300 C 96 390 176 428 256 428 C 336 428 416 390 416 300 L 416 160"
        fill="none" stroke="#0284C7" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Yoke Handle Ergonomic Grip Highlights -->
  <path d="M 96 160 L 96 228" fill="none" stroke="#38BDF8" stroke-width="48" stroke-linecap="round" />
  <path d="M 416 160 L 416 228" fill="none" stroke="#38BDF8" stroke-width="48" stroke-linecap="round" />

  <!-- Left Hat / Control Switch (Amber) -->
  <circle cx="96" cy="140" r="16" fill="#F59E0B" stroke="#0D1117" stroke-width="4" />

  <!-- Right Autopilot Master Switch (Emerald Green) -->
  <circle cx="416" cy="140" r="16" fill="#10B981" stroke="#0D1117" stroke-width="4" />

  <!-- Central Ascending Supersonic Aircraft (Vibrant Sky Blue) -->
  <path d="M 256 68
           L 276 160
           L 368 256
           L 348 280
           L 280 248
           L 280 344
           L 320 376
           L 310 394
           L 256 380
           L 202 394
           L 192 376
           L 232 344
           L 232 248
           L 164 280
           L 144 256
           L 236 160
           Z"
        fill="#38BDF8" />

  <!-- Avionics Gimbal / Artificial Horizon Reticle -->
  <circle cx="256" cy="228" r="32" fill="#0D1117" stroke="#38BDF8" stroke-width="8" />
  <line x1="234" y1="228" x2="278" y2="228" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="210" x2="256" y2="220" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="228" r="7" fill="#10B981" />
</svg>
